name: Website quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'development/**']
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/check_site.py
      - run: node --check scripts/main.js
      - run: python3 -m unittest discover -s tests -p test_pricing.py -v
      - run: node --check scripts/os-demo.js
